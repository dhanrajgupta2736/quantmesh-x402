[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# 1. Sentiment & Fusion Agent (Port 5001)
[program:sentiment-fusion-worker]
directory=/app/agent-sentiment-fusion
command=python3 -m uvicorn main:app --host 127.0.0.1 --port 5001
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# 2. On-Chain Whale & TA Agent (Port 5002)
[program:onchain-ta-worker]
directory=/app/agent-onchain-ta
command=python3 -m uvicorn main:app --host 127.0.0.1 --port 5002
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# 3. Regime & Volatility Classifier Agent (Port 5003)
[program:regime-classifier-worker]
directory=/app/agent-regime-classifier
command=python3 -m uvicorn main:app --host 127.0.0.1 --port 5003
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# 4. Central Orchestrator Gateway (Port 4000 or $PORT)
[program:orchestrator]
directory=/app/orchestrator
command=node dist/index.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

